<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kat · Reading Room</title><link rel="icon" type="image/svg+xml" href="/src/assets/kat-face.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/themes.css">
    <meta name="theme-color" content="#f5f3ec">
  </head>
  <body>
    <!-- Vite emits the palette stylesheet at the end of head. The blocking bootstrap
         runs before the first app element, even when its module is delayed. -->
    <script>try {
      const saved = localStorage.getItem('kat.appearance.theme');
      document.documentElement.dataset.theme = ['reading-room','linen-ink','coastal-slate','rosewood','amber-study','peony','wisteria','apricot-silk','sea-pearl','midnight-pine','ink-copper','blue-hour','aubergine','charcoal-gold','black-cherry','moonstone','cocoa-rose','midnight-orchid'].includes(saved) ? saved : 'reading-room';
    } catch {
      document.documentElement.dataset.theme = 'reading-room';
    }
    document.querySelector('meta[name="theme-color"]').content =
      getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();</script>
    <div id="root"></div><script type="module" src="/src/main.tsx"></script>
  </body>
</html>
