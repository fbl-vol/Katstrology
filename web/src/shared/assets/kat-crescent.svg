<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-label="Crescent-tail kitten primary logo" data-kitten="crescent-kitten" data-motion="off"><title>Crescent-tail kitten primary logo</title><style>
.fur{fill:#15121b;stroke:var(--cat-outline,#8e759b);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.fur-line{fill:none;stroke:#685273;stroke-width:1.6;stroke-linecap:round}
.iris{fill:var(--cat-eyes,#e6c178)}.pupil{fill:#15121b}.glint{fill:#fff9e9}
.eye{transform-box:fill-box;transform-origin:center}.tail{transform-origin:214px 277px}
svg[data-motion="on"] .eye{animation:kitten-blink 7s infinite}
svg[data-motion="on"] .tail{animation:kitten-tail 9s ease-in-out infinite}
svg[data-motion="on"] .star{transform-box:fill-box;transform-origin:center;animation:kitten-star 6s ease-in-out infinite}
@keyframes kitten-blink{0%,65%,70%,100%{transform:scaleY(1)}67%{transform:scaleY(.06)}}
@keyframes kitten-tail{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-2deg)}82%{transform:rotate(1deg)}}
@keyframes kitten-star{0%,100%{opacity:.75;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){svg[data-motion] .eye,svg[data-motion] .tail,svg[data-motion] .star{animation:none!important}}
