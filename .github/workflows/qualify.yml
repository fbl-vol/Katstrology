name: Candidate qualification
on:
  workflow_call:
    outputs:
      artifact-id:
        value: ${{ jobs.candidate.outputs.artifact-id }}
permissions:
  contents: read
# Workflow lock only: lanes remain parallel; distinct from caller/release locks.
concurrency:
  group: kat-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: backend, kind: backend }
          - { lane: browser-1, kind: browser }
          - { lane: browser-2, kind: browser }
          - { lane: browser-3, kind: browser }
          - { lane: browser-4, kind: browser }
          - { lane: interaction, kind: interaction }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/qualification-setup
        id: setup
        with:
          lane: ${{ matrix.kind }}
      - name: Complete isolated lane
        env:
          KAT_HOSTED_DOCKER_SOCKET: ${{ steps.setup.outputs.docker-socket }}
          QUALIFICATION_LANE: ${{ matrix.lane }}
        run: .venv-swiss/bin/python -m deploy.qualify --lane "$QUALIFICATION_LANE" --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: .local/qualification-lanes/${{ matrix.lane }}/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/qualification-setup
        id: setup
        with:
          lane: native
      - name: Build once and qualify the exact native archive
        id: package
        env:
          KAT_HOSTED_DOCKER_SOCKET: ${{ steps.setup.outputs.docker-socket }}
        run: .venv-swiss/bin/python -m deploy.qualify --lane native --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}-native
          path: .local/qualification-lanes/native/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: native
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.path }}/receipt.json
            ${{ steps.package.outputs.path }}/kat-production-amd64.tar
            ${{ steps.package.outputs.path }}/kat-public-source.tar
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  candidate:
    # Preserve the installed admission job name: release / qualify / candidate.
    name: candidate
    needs: [synthetic, native]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: npm ci --prefix web --no-audit --no-fund
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .local/ci-evidence
          merge-multiple: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-native
      - name: Join exact-source complete evidence without rebuilding
        run: python -m deploy.qualify --join .local/ci-evidence --receipt .local/ci-native/receipt.json --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: joined-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/release-qualification/*/synthetic.json
            .local/qualification-discovery/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .local/ci-native/receipt.json
            .local/ci-native/qualification.json
            .local/ci-native/kat-production-amd64.tar
            .local/ci-native/kat-public-source.tar
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
